name: Release Native Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/${{ matrix.os }}_${{ matrix.arch }}
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.os }}_${{ matrix.arch }}/fleet ./cli/cmd/fleet
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.os }}_${{ matrix.arch }}/bp ./backplane/cmd/bp
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.os }}_${{ matrix.arch }}/bpd ./backplane/cmd/bpd
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.os }}_${{ matrix.arch }}/sonar-mcp ./mcp/cmd/sonar-mcp

      - name: Package artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "${TAG}" ] || [[ "${TAG}" != v* ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.1.0' }}"
          fi

          mkdir -p release-assets
          cd dist/${{ matrix.os }}_${{ matrix.arch }}
          tar -czf ../../release-assets/fleet_${TAG}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz fleet bp bpd sonar-mcp
          
          # Standalone binaries for direct downloading
          cp fleet ../../release-assets/fleet-${{ matrix.os }}-${{ matrix.arch }}
          cp bp ../../release-assets/bp-${{ matrix.os }}-${{ matrix.arch }}
          cp bpd ../../release-assets/bpd-${{ matrix.os }}-${{ matrix.arch }}
          cp sonar-mcp ../../release-assets/sonar-mcp-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/

  publish-release:
    name: Publish GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          echo "==> Generating repository source SBOMs..."
          syft dir:. -o spdx-json=all-assets/fleet-source.spdx.json -o cyclonedx-json=all-assets/fleet-source.cyclonedx.json

          echo "==> Generating release archive SBOMs..."
          for archive in all-assets/*.tar.gz; do
            if [ -f "${archive}" ]; then
              base_name="$(basename "${archive}" .tar.gz)"
              syft file:"${archive}" -o spdx-json="all-assets/${base_name}.spdx.json" -o cyclonedx-json="all-assets/${base_name}.cyclonedx.json"
            fi
          done

      - name: Generate SHA256 Checksums
        run: |
          cd all-assets
          rm -f checksums.txt
          sha256sum * > checksums.txt 2>/dev/null || shasum -a 256 * > checksums.txt

      - name: Create / Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "${TAG}" ] || [[ "${TAG}" != v* ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.1.0' }}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists, uploading assets..."
            gh release upload "${TAG}" all-assets/* --clobber
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" all-assets/* \
              --title "Fleet ${TAG}" \
              --notes "Automated release containing prebuilt native CLI binaries (fleet, bp, bpd, sonar-mcp) and Software Bill of Materials (SBOMs in SPDX & CycloneDX formats) for Linux and macOS."
          fi
