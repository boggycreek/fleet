# golangci-lint configuration for Agent Sandbox Go Monorepo
run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - gocritic
    - misspell
    - nilerr
    - prealloc
    - unconvert
    - bodyclose
    - durationcheck
    - errorlint
    - makezero
    - nakedret
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unparam
    - whitespace

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gosec:
    severity: medium
    confidence: medium
  revive:
    severity: warning
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        disabled: false
      - name: package-comments
        disabled: false
  misspell:
    locale: US
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - opinionated

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
